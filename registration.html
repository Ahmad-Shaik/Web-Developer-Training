<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>registration-page</title>
    <style>
      .body{
        background-color: rgb(3, 3, 80);
       
      }
      .head{
        color: white;
        text-align: center;
        text-decoration: underline;
        font-size: 50px;
      }
      .table{
        background-color: white;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        padding: 5px;
        border-radius: 20px;
      }
      #box{
        border-radius: 10px;
        text-align: center;
      }
      #box:focus{
        background-color: rgb(62, 243, 62);
      }
      .btn{
        background-color: green;
        color: white;
        border-radius: 20px;
      }
      .btn:hover{
        background-color: blue;
      }
    </style>
  </head>
  <body class="body">
    <h1 class="head">Registration-page</h1>
    <form action="">
      <table class="table" align="center" cellpadding="10px">
        <tr>
        <td>Name</td>
        <td>:</td>
        <td><input type="text" name="" id="box" placeholder="Enter Your Name" required></td>
      </tr>
      <tr>
        <td>Mobile NO</td>
        <td>:</td>
        <td><input type="number" name="" id="box" placeholder="Enter Your Mobile Number" required></td>
      </tr>
      <tr>
        <td>Password</td>
        <td>:</td>
        <td><input type="password" name="" id="box" placeholder="Enter Your Password" required></td>
      </tr>
      <tr>
        <td>E-Mail</td>
        <td>:</td>
        <td><input type="email" name="" id="box" placeholder="Enter Your E-Mail ID" required></td>
      </tr>
      <tr>
        <td>Password</td>
        <td>:</td>
        <td><input type="password" name="" id="box" placeholder="Enter Your Password" required></td>
      </tr>
      <tr>
        <td>District</td>
        <td>:</td>
        <td>
          <select name="" id="box" required>
            <option value="">---select---</option>
            <optgroup label="Andhra Pradesh">
              <option value="">Vijayawada</option>
            </optgroup>
            <optgroup label="Telangana">
              <option value="">Hyderabad</option>
            </optgroup>
          </select>
        </td>
      </tr>
      <tr>
        <td>Gender</td>
        <td>:</td>
        <td><input type="radio" name="a" id="box" required>Male <input type="radio" name="a" id="box" required>Female </td>
      </tr>
      <tr>
        <td>Address</td>
        <td>:</td>
        <td><textarea name="" id="box"></textarea></td>
      </tr>
      <tr>
        <td colspan="3"><button class="btn">Submit</button></td>
      </tr>
      </table>
    </form>
  </body>
</html>
